# Babel extraction configuration for GaiaPulse
# Run: pybabel extract -F babel.cfg -o app/locales/messages.pot .
# Then: pybabel update -i app/locales/messages.pot -d app/locales -D messages
# Then: pybabel compile -d app/locales -D messages

[python: app/**.py]
encoding = utf-8

[jinja2: app/templates/**.html]
encoding = utf-8
extensions = jinja2.ext.i18n
