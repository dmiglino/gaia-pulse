services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaiapulse
      POSTGRES_USER: gaiapulse
      POSTGRES_PASSWORD: gaiapulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaiapulse -d gaiapulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DATABASE_URL: postgresql://gaiapulse:gaiapulse@db:5432/gaiapulse
      APP_SECRET_KEY: change-me-in-production-use-a-long-random-string
      ENABLE_BACKGROUND_JOBS: "true"
      TIMEZONE: "America/Argentina/Buenos_Aires"
      # Optional: add your OpenAI key here to enable NLP + voice
      # OPENAI_API_KEY: sk-...
      # STT_PROVIDER: whisper
    ports:
      - "8000:8000"
    volumes:
      - .:/app:Z
    command: >
      sh -c "
        echo 'Waiting for DB...' &&
        python -c 'import time; time.sleep(3)' &&
        DATABASE_URL=postgresql://gaiapulse:gaiapulse@db:5432/gaiapulse alembic upgrade head &&
        python seed.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  pgdata:
