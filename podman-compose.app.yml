services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      # DB runs externally (e.g. Docker container on host port 5432)
      DATABASE_URL: ${DATABASE_URL:-postgresql://gaiapulse:gaiapulse@host.containers.internal:5432/gaiapulse}
      APP_SECRET_KEY: change-me-in-production-use-a-long-random-string
      ENABLE_BACKGROUND_JOBS: "true"
      TIMEZONE: "America/Argentina/Buenos_Aires"
      # Optional: add your OpenAI key here to enable NLP + voice
      # OPENAI_API_KEY: sk-...
      # STT_PROVIDER: whisper
    ports:
      - "8000:8000"
    volumes:
      - .:/app:Z
    command: >
      sh -c "
        echo 'Using external DB at: ${DATABASE_URL}' &&
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
